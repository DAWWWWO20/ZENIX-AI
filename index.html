
<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENIX AI</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>

    <div class="app">
        <aside class="sidebar">
            <h2>🤖 ZENIX</h2>
            <nav>
                <button>⌂ Գլխավոր</button>
                <button>💬 Զրույցներ</button>
                <button>⭐ Սիրվածներ</button>
                <button>⚙ Կարգավորումներ</button>
            </nav>
            <div class="profile">● ZENIX ONLINE</div>
        </aside>

        <main class="main">
            <header>
                <h2>Բարի գալուստ ZENIX</h2>
                <span>AI ASSISTANT ●</span>
            </header>

        
<div class="robot-area">
    <div class="robot-3d" id="robot">

        <div class="antenna"></div>

        <div class="robot-head">
            <div class="ear left-ear"></div>
            <div class="ear right-ear"></div>

            <div class="visor">
                <div class="eye"></div>
                <div class="eye"></div>
                <div class="robot-mouth"></div>
            </div>
        </div>

        <div class="neck"></div>

        <div class="robot-torso">
            <div class="core"></div>
            <div class="chest-light"></div>
            <div class="robot-name">ZENIX</div>
        </div>

        <div class="arms">
            <div class="arm left-arm"></div>
            <div class="arm right-arm"></div>
        </div>

        <div class="legs">
    <div class="leg"></div>
    <div class="leg"></div>
</div>

<div class="hologram-floor">
    <div class="floor-ring ring-one"></div>
    <div class="floor-ring ring-two"></div>
    <div class="floor-ring ring-three"></div>
    <div class="floor-glow"></div>
</div>

    </div>

    <h1>Ես ZENIX-ն եմ</h1>
    <p>Քո անձնական արհեստական բանականությունը</p>
</div>

            <section class="chat">
                <div class="messages" id="messages">
                    <div class="message">Բարև՛։ Ես պատրաստ եմ օգնելու քեզ ❤️</div>
                </div>
                <div class="input-area">
                    <input id="userInput" placeholder="Գրիր հաղորդագրություն...">
                    <button id="sendBtn">➤</button>
                    <button id="voiceBtn">🎤</button>
                </div>
            </section>
        </main>

        <aside class="rightbar">
            <h3>⚡ ZENIX STATUS</h3>
            <div class="info">🧠 AI STATUS<br><b>ONLINE</b></div>
            <div class="info">🔊 VOICE<br><b>READY</b></div>
            <div class="info">✨ VERSION<br><b>1.0</b></div>
        </aside>
    </div>

    <script src="cods.js"></script>
</body>
</html>
